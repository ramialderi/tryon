<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جرّب النظارات على وجهك</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1a2b;--panel:#16263d;--line:#2a4163;--ink:#eaf1fb;--mute:#8da4c4;--acc:#ffb703}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Readex Pro',Tahoma,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:1.4rem;font-weight:700;margin:4px 0 14px}
.stage{position:relative;width:100%;max-width:760px;background:#07101c;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
canvas{width:100%;height:auto;display:block}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mute);line-height:1.8;pointer-events:none}
#msg.hide{display:none}
#tag{position:absolute;bottom:10px;inset-inline-start:10px;background:#000a;padding:4px 10px;border-radius:99px;font-size:.8rem;display:none}
.tray{width:100%;max-width:760px;margin-top:14px;display:grid;gap:14px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.row h2{font-size:.85rem;font-weight:500;color:var(--mute);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;touch-action:manipulation;min-height:42px;cursor:pointer;color:var(--ink);background:#1d3555;border:1px solid var(--line);border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--acc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);color:#1a1200;border-color:var(--acc);font-weight:700}
.sw{width:34px;height:34px;padding:0;border-radius:50%;border:2px solid transparent}
.sw.on{border-color:#fff;outline:2px solid var(--acc)}
.big{background:var(--acc);color:#1a1200;font-weight:700;border:0;padding:12px 22px;font-size:1rem}
.bar{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<h1>جرّب النظارات والفلاتر على وجهك</h1>

<div class="stage">
  <canvas id="c" width="960" height="720"></canvas>
  <div id="msg">اضغط «تشغيل الكاميرا» وسمح للمتصفح باستخدامها.<br>الصورة تبقى على جهازك ولا تُرفع لأي مكان.</div>
  <div id="tag"></div>
</div>

<div class="tray">
  <div class="bar">
    <button class="big" id="start">تشغيل الكاميرا</button>
    <button id="snap" disabled>التقاط صورة</button>
    <button id="flip" disabled>تبديل الكاميرا</button>
  </div>
  <div class="row"><h2>شكل النظارة</h2>
    <div class="chips" id="styles"></div></div>
  <div class="row"><h2>لون الإطار</h2>
    <div class="chips" id="colors"></div></div>
  <div class="row"><h2>إضافات</h2>
    <div class="chips" id="extras"></div></div>
</div>

<video id="v" playsinline muted style="display:none"></video>

<script type="module">
import {FaceLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),vid=$('v'),msg=$('msg'),tag=$('tag');
const S={glasses:'round',color:'#111111',mustache:false,hat:false,nose:false};

const STYLES=[['none','بدون'],['round','دائرية'],['square','مربعة'],['aviator','أفييتور'],['cat','عيون القطة'],['sun','شمسية']];
const COLORS=['#111111','#c0392b','#2e86de','#1e9e5a','#d4a017','#8e44ad','#f5f5f5'];
const EXTRAS=[['mustache','شنب'],['hat','قبعة'],['nose','أنف مهرّج']];

function chips(box,items,key,single){
  items.forEach(([k,label])=>{
    const b=document.createElement('button');b.textContent=label;b.dataset.k=k;
    b.className=(single?S[key]===k:S[k])?'on':'';
    b.onclick=()=>{
      if(single){S[key]=k;[...box.children].forEach(x=>x.classList.toggle('on',x===b))}
      else{S[k]=!S[k];b.classList.toggle('on',S[k])}
    };box.appendChild(b);
  });
}
chips($('styles'),STYLES,'glasses',true);
chips($('extras'),EXTRAS,null,false);
COLORS.forEach(c=>{
  const b=document.createElement('button');b.className='sw'+(c===S.color?' on':'');
  b.style.background=c;b.setAttribute('aria-label','لون '+c);
  b.onclick=()=>{S.color=c;[...$('colors').children].forEach(x=>x.classList.toggle('on',x===b))};
  $('colors').appendChild(b);
});

let lm=null,running=false,lastT=-1,facing='user';
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.rect(x,y,w,h)};
async function startCam(){
  if(vid.srcObject)vid.srcObject.getTracks().forEach(t=>t.stop());
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
  vid.srcObject=stream;await vid.play();
  cv.width=vid.videoWidth;cv.height=vid.videoHeight;lastT=-1;
}

$('start').onclick=async()=>{
  if(running)return;
  $('start').disabled=true;msg.textContent='جارٍ تشغيل الكاميرا…';
  try{
    await startCam();
  }catch(e){
    msg.innerHTML='تعذّر تشغيل الكاميرا.<br>تأكد من السماح بالكاميرا من إعدادات المتصفح، وأن لا برنامج آخر يستخدمها.';
    $('start').disabled=false;return;
  }
  msg.textContent='جارٍ تحميل نموذج تتبّع الوجه (أول مرة فقط، يحتاج إنترنت)…';
  try{
    const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const mk=dl=>FaceLandmarker.createFromOptions(fs,{
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:dl},
      runningMode:"VIDEO",numFaces:1});
    try{lm=await mk("GPU")}catch(_){lm=await mk("CPU")}
  }catch(e){
    msg.innerHTML='تعذّر تحميل نموذج الوجه. تأكد من اتصال الإنترنت وأعد المحاولة.';
    $('start').disabled=false;return;
  }
  msg.classList.add('hide');tag.style.display='block';$('snap').disabled=false;$('flip').disabled=false;
  $('start').textContent='الكاميرا شغّالة';running=true;loop();
};

$('flip').onclick=async()=>{facing=facing==='user'?'environment':'user';try{await startCam()}catch(e){facing=facing==='user'?'environment':'user';await startCam()}};
$('snap').onclick=()=>{
  const a=document.createElement('a');a.href=cv.toDataURL('image/png');
  a.download='face-filter-'+Date.now()+'.png';a.click();
};

const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function loop(){
  const W=cv.width,H=cv.height;
  const M=facing==='user';
  ctx.save();if(M){ctx.translate(W,0);ctx.scale(-1,1)}ctx.drawImage(vid,0,0,W,H);ctx.restore();
  if(vid.currentTime!==lastT){
    lastT=vid.currentTime;
    const r=lm.detectForVideo(vid,performance.now());
    const f=r.faceLandmarks&&r.faceLandmarks[0];
    if(f){tag.textContent='تم رصد الوجه';draw(f,W,H,M)}else tag.textContent='لا يوجد وجه في الصورة';
    loop.f=f;
  }else if(loop.f)draw(loop.f,W,H,M);
  requestAnimationFrame(loop);
}

function draw(f,W,H,M){
  const P=i=>({x:(M?1-f[i].x:f[i].x)*W,y:f[i].y*H});          // mirrored point in pixels
  let A=mid(P(33),P(133)),B=mid(P(362),P(263));
  if(A.x>B.x)[A,B]=[B,A];
  const d=dist(A,B),ang=Math.atan2(B.y-A.y,B.x-A.x),c=mid(A,B);

  if(S.hat){
    const t=P(10),fw=dist(P(234),P(454));
    ctx.save();ctx.translate(t.x,t.y);ctx.rotate(ang);
    ctx.fillStyle='#1b1b1f';ctx.fillRect(-fw*.31,-fw*.62,fw*.62,fw*.6);
    ctx.fillStyle='#b3262b';ctx.fillRect(-fw*.31,-fw*.16,fw*.62,fw*.13);
    ctx.beginPath();ctx.ellipse(0,-fw*.02,fw*.5,fw*.07,0,0,7);ctx.fillStyle='#1b1b1f';ctx.fill();
    ctx.restore();
  }
  if(S.nose){
    const n=P(1);ctx.save();
    ctx.beginPath();ctx.arc(n.x,n.y,d*.2,0,7);ctx.fillStyle='#e02929';ctx.fill();
    ctx.beginPath();ctx.arc(n.x-d*.06,n.y-d*.07,d*.05,0,7);ctx.fillStyle='#ffffff88';ctx.fill();ctx.restore();
  }
  if(S.mustache){
    const m=mid(P(2),P(0)),w=dist(P(61),P(291))*1.5,h=w*.28;
    ctx.save();ctx.translate(m.x,m.y+h*.15);ctx.rotate(ang);ctx.fillStyle='#2b1b10';
    for(const s of[1,-1]){
      ctx.save();ctx.scale(s,1);ctx.beginPath();ctx.moveTo(0,-h*.15);
      ctx.bezierCurveTo(w*.12,-h*.6,w*.38,-h*.45,w*.5,h*.4);
      ctx.bezierCurveTo(w*.3,h*.05,w*.15,h*.2,0,h*.2);ctx.fill();ctx.restore();
    }
    ctx.restore();
  }
  if(S.glasses!=='none'){
    ctx.save();ctx.translate(c.x,c.y);ctx.rotate(ang);
    glasses(S.glasses,S.color,d);ctx.restore();
  }
}

function lensPath(st,cx,s,d){
  const w=d*.82,h=d*.6;ctx.beginPath();
  if(st==='round'){ctx.ellipse(cx,0,d*.4,d*.4,0,0,7)}
  else if(st==='square'||st==='sun'){ctx.roundRect(cx-w/2,-h/2,w,h,d*.1)}
  else if(st==='aviator'){
    ctx.moveTo(cx-w/2,-h*.45);ctx.lineTo(cx+w/2,-h*.45);
    ctx.quadraticCurveTo(cx+w/2,h*.75,cx,h*.75);
    ctx.quadraticCurveTo(cx-w/2,h*.75,cx-w/2,-h*.45);ctx.closePath();
  }else if(st==='cat'){
    const o=cx+s*w/2,i=cx-s*w/2;
    ctx.moveTo(i,-h*.3);ctx.quadraticCurveTo(cx,-h*.5,o+s*w*.06,-h*.7);
    ctx.quadraticCurveTo(o+s*w*.08,h*.3,cx,h*.5);
    ctx.quadraticCurveTo(i-s*w*.02,h*.4,i,-h*.3);ctx.closePath();
  }
}

function glasses(st,color,d){
  const lw=Math.max(2,d*(st==='sun'?.08:.055));
  ctx.lineWidth=lw;ctx.strokeStyle=color;ctx.lineJoin='round';ctx.lineCap='round';
  // arms
  ctx.beginPath();
  for(const s of[1,-1]){ctx.moveTo(s*(d/2+d*.4),-d*.02);ctx.lineTo(s*(d/2+d*.78),d*.05)}
  ctx.stroke();
  // bridge
  ctx.beginPath();ctx.moveTo(-d*.1,-d*.12);ctx.quadraticCurveTo(0,-d*.2,d*.1,-d*.12);ctx.stroke();
  // lenses
  for(const s of[-1,1]){
    lensPath(st,s*d/2,s,d);
    ctx.fillStyle=st==='sun'?'rgba(8,8,12,.88)':'rgba(170,215,255,.2)';ctx.fill();ctx.stroke();
    if(st!=='sun'){ // glint
      ctx.save();ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=lw*.35;
      ctx.beginPath();ctx.moveTo(s*d/2-d*.2,-d*.14);ctx.lineTo(s*d/2-d*.08,-d*.26);ctx.stroke();ctx.restore();
    }
  }
}
</script>
</body>
</html>
